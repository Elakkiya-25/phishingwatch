<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishWatch Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="text-center text-white py-5">
    <h1 class="display-4">🛡️ PhishWatch Web</h1>
    <p class="lead">Detect phishing emails and suspicious links instantly</p>
  </header>

  <main class="container p-5 rounded shadow-lg bg-light" id="mainContainer">
    <form method="POST">
      <div class="mb-3">
        <label for="email" class="form-label fw-bold">Paste Email or URL:</label>
        <textarea id="email" name="email" class="form-control" rows="6" placeholder="Paste your email or URL here..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Scan</button>
    </form>

    {% if result %}
    <div class="alert mt-4 alert-{{ status }} fs-5" role="alert" id="resultBox">
      {{ result }}
    </div>
    {% endif %}
  </main>

  <footer class="text-center text-white py-3">
    <p>© 2025 PhishWatch Web | Stay safe online</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
